name: Apply receipt history patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-receipt-history-and-real-paid.py'
      - '.github/workflows/apply-receipt-history-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply patch
        run: python scripts/apply-receipt-history-and-real-paid.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit generated application change
        run: |
          if git diff --quiet -- components/Admin.tsx; then
            echo "No Admin.tsx changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Admin.tsx
          git commit -m "feat: add collapsible receipt history and real approved amounts"
          git push origin HEAD:main
