name: Deploy secretary minutes service
on:
  push:
    branches: [feat/secretariat-minutes, main]
    paths:
      - 'functions/src/meeting*.ts'
      - 'functions/src/index.ts'
      - 'firestore.rules'
      - 'tests/secretariat*.mjs'
      - '.github/workflows/secretariat-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mi-logia-secretariat-backend
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/mi-logia-secretariat-deploy.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      - run: node tests/secretariat.mjs
      - run: node tests/secretariat-backend.mjs
      - name: Install Firebase and rule verification tools
        run: npm install --no-save --package-lock=false firebase-tools@14.22.0 @firebase/rules-unit-testing@3.0.4
      - name: Verify protected secretary access
        run: npx firebase emulators:exec --only firestore --project demo-mi-logia-security --config firebase.security-test.json 'node tests/security-rules.mjs'
      - name: Prepare existing deployment identity and optional Gemini server key
        env:
          DEPLOY_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT2 }}
          MEETING_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY || secrets.API_KEY }}
          MEETING_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python3 - <<'PY'
          import os, re
          path = os.environ['GOOGLE_APPLICATION_CREDENTIALS']
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(descriptor, 'w') as handle:
              handle.write(os.environ['DEPLOY_CREDENTIALS'])
          key = os.environ.get('MEETING_GEMINI_KEY', '').strip()
          model = os.environ.get('MEETING_GEMINI_MODEL', '').strip() or 'gemini-flash-latest'
          if key:
              if not re.fullmatch(r'[A-Za-z0-9_-]{20,200}', key) or not re.fullmatch(r'[A-Za-z0-9._-]{1,100}', model):
                  raise RuntimeError('Invalid Gemini key or model configuration; values were not logged.')
              descriptor = os.open('functions/.env.registrologia', os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(descriptor, 'w') as handle:
                  handle.write('GEMINI_API_KEY=' + key + '\nGEMINI_MODEL=' + model + '\n')
          print('Meeting AI key configured:', bool(key))
          PY
      - name: Publish private minute rules and protect secretary appointments
        run: npx firebase deploy --only firestore:rules --project registrologia --non-interactive
      - name: Publish text-only meeting organizer
        run: npx firebase deploy --only functions:organizeMeetingMinutes --project registrologia --non-interactive
      - name: Remove temporary credentials and runtime environment file
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS" functions/.env.registrologia
