name: Fix historical excess double count

on:
  push:
    branches: [fix/historical-excess-no-double-count]
    paths:
      - scripts/fix-historical-excess-double-count.py
      - .github/workflows/fix-historical-excess-double-count.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-excess-no-double-count
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply double-count fix
        run: python3 scripts/fix-historical-excess-double-count.py
      - name: Install dependencies
        run: npm ci
      - name: Accounting tests
        run: npm run test:accounting
      - name: Production build
        run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Admin.tsx components/AdminPaymentEvidenceModal.tsx
          git diff --cached --quiet || git commit -m "fix: avoid duplicate historical excess in matrix"
          git push origin fix/historical-excess-no-double-count
