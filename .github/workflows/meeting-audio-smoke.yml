name: Verify Gemini audio with synthetic speech
on:
  push:
    branches: [feat/mobile-secretariat]
    paths: ['tests/fixtures/meeting-smoke.m4a.b64']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      - name: One real transcription and summary using synthetic M4A
        env:
          MEETING_GEMINI_KEY: ${{ secrets.API_KEY_GEMINI_FREE || secrets.GEMINI_API_KEY || secrets.API_KEY }}
          MEETING_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node tests/secretariat-audio-live.mjs
