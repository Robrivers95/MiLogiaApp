name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extra fee integration tests
        run: node tests/extra-fee-integration.mjs
      - name: WhatsApp reminder tests
        run: node tests/run-whatsapp.mjs
      - name: Quick finance integration tests
        run: node tests/quick-finance-integration.mjs
      - name: Member recovery isolation tests
        run: node tests/account-recovery.mjs
      - name: Modular secretary and AI guards
        run: node tests/secretariat.mjs && node tests/secretariat-backend.mjs && node tests/secretariat-recorder.mjs
      - name: Capture proposals and confirmed task transactions
        run: node tests/task-capture.mjs && node tests/task-capture-backend.mjs
      - name: Multi-audio transcription policy and queue guards
        run: node tests/secretariat-audio.mjs && node tests/secretariat-audio-backend.mjs
      - name: Treasury report tests
        run: node tests/treasury-report.mjs
      - name: Build
        run: npm run build

