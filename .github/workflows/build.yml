name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extra fee integration tests
        run: node tests/extra-fee-integration.mjs
      - name: WhatsApp reminder tests
        run: node tests/run-whatsapp.mjs
      - name: Build
        run: npm run build
