name: Build and deploy Mi Logia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mi-logia-live
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Accounting regression tests
        run: npm run test:accounting
      - name: Project regression tests
        run: node tests/project-finance-accounting.mjs
      - name: Directory and navigation tests
        run: node tests/run-directory.mjs
      - name: Production build
        run: npm run build
      - name: Publish live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT2 }}
          channelId: live
          projectId: registrologia
