name: Build and deploy Mi Logia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mi-logia-live
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Accounting regression tests
        run: npm run test:accounting
      - name: Project regression tests
        run: node tests/project-finance-accounting.mjs
      - name: Directory and navigation tests
        run: node tests/run-directory.mjs
      - name: Extra fee integration tests
        run: node tests/extra-fee-integration.mjs
      - name: WhatsApp reminder tests
        run: node tests/run-whatsapp.mjs
      - name: Quick finance integration tests
        run: node tests/quick-finance-integration.mjs
      - name: Member recovery isolation tests
        run: node tests/account-recovery.mjs
      - name: Member admission and reactivation
        run: node tests/member-admission.mjs
      - name: Modular secretary and AI guards
        run: node tests/secretariat.mjs && node tests/secretariat-backend.mjs && node tests/secretariat-recorder.mjs
      - name: Capture proposals and confirmed task transactions
        run: node tests/task-capture.mjs && node tests/task-capture-backend.mjs
      - name: Multi-audio transcription policy and queue guards
        run: node tests/secretariat-audio.mjs && node tests/secretariat-audio-backend.mjs
      - name: Income AI approval transactions
        run: node tests/income-capture.mjs
      - name: Treasury report tests
        run: node tests/treasury-report.mjs
      - name: Verify account feature deployment gate
        run: node scripts/check-member-access-deployment.mjs
      - name: Production build
        run: npm run build
      - name: Publish live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT2 }}
          channelId: live
          projectId: registrologia

