name: Apply approved receipt edit patch

on:
  push:
    paths:
      - 'scripts/apply-approved-receipt-edit.py'
      - '.github/workflows/apply-approved-receipt-edit.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-approved-receipt-edit.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api.ts components/Admin.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "feat: allow safe editing of approved payment receipts"
            git push origin HEAD:main
          fi
