name: Deploy bank import service
on:
  push:
    branches: [main]
    paths:
      - 'functions/src/meetingBank*.ts'
      - 'functions/src/meetingIncome*.ts'
      - '.github/workflows/income-capture-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mi-logia-secretariat-backend
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/mi-logia-bank-import-deploy.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      - run: node tests/task-capture-backend.mjs
      - name: Prepare existing deployment identity and optional Gemini server key
        env:
          DEPLOY_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT2 }}
          CAPTURE_GEMINI_KEY: ${{ secrets.API_KEY_GEMINI_FREE || secrets.GEMINI_API_KEY || secrets.API_KEY }}
          CAPTURE_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python3 - <<'PY'
          import os, re
          path = os.environ['GOOGLE_APPLICATION_CREDENTIALS']
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(descriptor, 'w') as handle:
              handle.write(os.environ['DEPLOY_CREDENTIALS'])
          key = os.environ.get('CAPTURE_GEMINI_KEY', '').strip()
          model = os.environ.get('CAPTURE_GEMINI_MODEL', '').strip() or 'gemini-flash-latest'
          if key:
              # Treat keys as opaque credentials; authorization keys can contain dots and be longer than legacy keys.
              if not re.fullmatch(r'[A-Za-z0-9._=-]{20,4096}', key):
                  raise RuntimeError('Gemini secret contains unsupported characters or length; value was not logged.')
              if not re.fullmatch(r'[A-Za-z0-9._-]{1,100}', model):
                  raise RuntimeError('Invalid Gemini model configuration; value was not logged.')
              descriptor = os.open('functions/.env.registrologia', os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(descriptor, 'w') as handle:
                  handle.write('GEMINI_API_KEY=' + key + '\nGEMINI_MODEL=' + model + '\n')
          print('Meeting AI key configured:', bool(key))
          PY
      - name: Publish capture function
        run: npx --yes --package firebase-tools@14.22.0 firebase deploy --only functions:captureWithAI --project registrologia --non-interactive
      - name: Remove temporary deployment files
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS" functions/.env.registrologia
