name: Apply member status improvements

on:
  push:
    branches: [member-status-and-debt-notifications]
    paths:
      - scripts/apply-member-status.mjs
      - .github/workflows/apply-member-status.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member-status-and-debt-notifications
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply changes
        run: node scripts/apply-member-status.mjs
      - name: Install and build
        run: npm ci && npm run build
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Admin.tsx components/Layout.tsx services/api.ts types.ts package.json package-lock.json
          git diff --cached --quiet || git commit -m "feat: add member leave dates and notification safeguards"
          git push origin member-status-and-debt-notifications
