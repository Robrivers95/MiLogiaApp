name: Apply payment movement reconciliation

on:
  push:
    branches: [fix/payment-movement-reconciliation]
    paths:
      - scripts/apply-payment-movement-reconciliation.py
      - services/paymentMovements.ts
      - services/paymentMovementAccounting.ts
      - components/PaymentMovementModal.tsx
      - .github/workflows/apply-payment-movement-reconciliation.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/payment-movement-reconciliation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source changes
        run: python3 scripts/apply-payment-movement-reconciliation.py

      - name: Install dependencies
        run: npm ci

      - name: Accounting tests
        run: npm run test:accounting

      - name: Production build
        run: npm run build

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add types.ts services/api.ts services/paymentMovements.ts services/paymentMovementAccounting.ts components/Admin.tsx components/Payments.tsx components/PaymentMovementModal.tsx firestore.rules tests/run-accounting.mjs tests/paymentMovementAccounting.test.ts
          git diff --cached --quiet || git commit -m "feat: track payment movements for bank reconciliation"
          git push origin fix/payment-movement-reconciliation
