name: Verify responsive members

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/Member*.tsx'
      - 'components/Admin.tsx'
      - 'components/ExistingFeeAssignment.tsx'
      - 'components/Payments.tsx'
      - 'components/WhatsAppReminders.tsx'
      - 'components/QuickFinance.tsx'
      - 'components/TreasuryReport.tsx'
      - 'services/treasuryReport.ts'
      - 'tests/treasury-report*'
      - 'services/quickFinance*'
      - 'tests/quick-finance*'
      - 'services/whatsappReminders.ts'
      - 'tests/whatsapp*'
      - 'services/extraFeeLifecycle.ts'
      - 'services/member*.ts'
      - 'tests/member*'
      - 'tests/temple*'
      - 'tests/secretariat*'
      - 'services/meeting*'
      - 'components/TempleExplorer.tsx'
      - 'services/templeExplorer.ts'
      - 'services/templeWorld.ts'
      - 'services/zodiacMyths.ts'
      - 'public/temple/**'
      - 'services/templeScene.ts'
      - 'services/firstDegreePdf.ts'
      - 'components/FirstDegreePdf.tsx'
      - 'components/Library.tsx'
      - 'components/Secretariat.tsx'
      - 'components/SecretariatAdvanced.tsx'
      - 'components/CaptureAssistant.tsx'
      - 'services/taskCapture*'
      - 'tests/task-capture*'
      - 'App.tsx'
      - 'styles/**'
      - 'components/Layout.tsx'
      - 'components/MasonicIdentity.tsx'
      - 'components/LodgeLogoEditor.tsx'
      - 'components/RequiredPasswordChange.tsx'
      - '.github/workflows/member-ui.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Install WebKit for mobile admission
        timeout-minutes: 5
        run: npx playwright install --with-deps webkit
      - name: Verify responsive member UI
        run: node tests/member-ui.mjs
      - name: Verify administrator admission in the real mobile Admin screen
        run: node tests/member-admission-ui.mjs && LOGIA_ADMISSION_BROWSER=webkit node tests/member-admission-ui.mjs
      - name: Verify WhatsApp reminders
        run: node tests/whatsapp-ui.mjs
      - name: Verify quick finance
        run: node tests/quick-finance-ui.mjs
      - name: Verify treasury report
        run: node tests/treasury-report-ui.mjs
      - name: Verify temple and member access
        run: node tests/temple-ui.mjs
      - name: Verify recovery survives administrator reauthentication
        run: node tests/member-access-session-ui.mjs
      - name: Verify recorder and modular secretary editor
        run: node tests/secretariat-ui.mjs
      - name: Verify corrected and confirmed task capture
        run: node tests/task-capture-ui.mjs
      - name: Verify compact mobile secretary and multi-audio flow
        run: node tests/secretariat-mobile-ui.mjs
      - name: Verify apprentice temple exploration
        run: node tests/temple-explorer.mjs && node tests/temple-explorer-ui.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-members-screenshots
          path: test-results/


