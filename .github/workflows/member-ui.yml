name: Verify responsive members

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/Member*.tsx'
      - 'components/Admin.tsx'
      - 'services/member*.ts'
      - 'tests/member*'
      - '.github/workflows/member-ui.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify responsive member UI
        run: node tests/member-ui.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-members-screenshots
          path: test-results/
